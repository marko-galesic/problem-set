<p>Given an array where each element represents your maximum jump length at that position, determine if you can reach the last index.</p>

<h3>Method Signature</h3>
<pre><code>public boolean canJump(int[] nums)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [2, 3, 1, 1, 4]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true</code></pre>
