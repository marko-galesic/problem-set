<p>
  Given the root of a BST and integer k, return the k-th smallest value.
</p>

<h3>Method Signature</h3>
<pre><code>public int kthSmallestInBst(TreeNode root, int k)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Assume the input is a valid BST.</li>
  <li>k is 1-indexed.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>root = [3,1,4,null,2], k = 1
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>1
</code></pre>
