<p>
    Find all possible combinations of <code>k</code> numbers between 1 and 9 that sum to <code>n</code>.
  </p>

  <h3>Method Signature</h3>
  <pre><code>public int[][] combinationSum3(int k, int n)</code></pre>

  <h3>Requirements</h3>
  <ul>
    <li>Each number is used at most once</li>
<li>Combinations must be in ascending order</li>
  </ul>

  <h3>Example</h3>
  <p><strong>Input:</strong></p>
  <pre><code>k = 3, n = 7</code></pre>

  <p><strong>Output:</strong></p>
  <pre><code>[[1, 2, 4]]</code></pre>
