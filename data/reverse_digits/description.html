<p>
  Given an integer n, return the number formed by reversing its decimal digits. Preserve the sign.
</p>

<h3>Method Signature</h3>
<pre><code>public int reverseDigits(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Use the absolute value of n when processing digits.</li>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = -120
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>-21
</code></pre>
