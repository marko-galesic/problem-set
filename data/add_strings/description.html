<p>Add two non-negative integers given as strings and return the sum as a string.</p>

<h3>Method Signature</h3>
<pre><code>public String addStrings(String num1, String num2)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>num1 = "11"
num2 = "123"</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"134"</code></pre>
