<p>Return the length of the longest path between any two nodes in a binary tree (measured in edges).</p>

<h3>Method Signature</h3>
<pre><code>public int diameterOfBinaryTree(TreeNode root)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>root = [1, 2, 3, 4, 5]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3</code></pre>
