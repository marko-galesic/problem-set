<p>Convert an integer between 1 and 3999 into its Roman numeral representation.</p>

<h3>Method Signature</h3>
<pre><code>public String intToRoman(int num)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>num = 58</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"LVIII"</code></pre>
