<p>Given a list of non-negative integers representing money in houses along a street, return the maximum amount you can rob without robbing two adjacent houses.</p>

<h3>Method Signature</h3>
<pre><code>public int rob(int[] nums)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [2, 7, 9, 3, 1]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>12</code></pre>
