<p>
  Given a non-empty array of integers nums, return the average value as a floating point number.
</p>

<h3>Method Signature</h3>
<pre><code>public double averageOfArray(int[] nums)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 2, 3]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2.0
</code></pre>
