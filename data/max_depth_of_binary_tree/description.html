<p>Return the maximum depth of a binary tree.</p>

<h3>Method Signature</h3>
<pre><code>public int maxDepth(TreeNode root)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>root = [3, 9, 20, null, null, 15, 7]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3</code></pre>
