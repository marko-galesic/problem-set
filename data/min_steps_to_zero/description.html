<p>
  Given an integer n, count the steps to reduce it to zero using the specified operations.
</p>

<h3>Method Signature</h3>
<pre><code>public int minStepsToZero(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>If n is even, divide by 2; if odd, subtract 1.</li>
  <li>Return the number of steps to reach 0.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
