<p>
  Given an array of bar heights representing a histogram, return the area of the
  largest rectangle that can be formed.
</p>

<h3>Method Signature</h3>
<pre><code>public int largestRectangleArea(int[] heights)</code></pre>

<h3>Example</h3>
<pre><code>heights = [2,1,5,6,2,3]
Output: 10</code></pre>
