<p>
  Given an integer n, return the sum of integers from 1 to n. If n <= 0, return 0.
</p>

<h3>Method Signature</h3>
<pre><code>public int sumFromOneToN(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Follow the rule for non-positive values described above.</li>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 5
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>15
</code></pre>
