<p>
  Given an integer n, return n + 9.
</p>

<h3>Method Signature</h3>
<pre><code>public int addNine(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
  <li>The input may be negative.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>9
</code></pre>
