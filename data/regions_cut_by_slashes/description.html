<p>
  Given an N x N grid of characters containing '/', '\\', or space, treat each
  cell as divided by the slash. Return the number of regions formed.
</p>

<h3>Method Signature</h3>
<pre><code>public int regionsBySlashes(String[] grid)</code></pre>

<h3>Example</h3>
<pre><code>grid = [" /","/ "]
Output: 2</code></pre>
