<p>Given an array containing n distinct numbers taken from 0..n, return the missing number.</p>

<h3>Method Signature</h3>
<pre><code>public int missingNumber(int[] nums)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [3, 0, 1]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2</code></pre>
