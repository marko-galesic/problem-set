<p>
  Given a string s, return true if it ends with "?".
</p>

<h3>Method Signature</h3>
<pre><code>public boolean endsWithQuestionMark(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "Hi?"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
