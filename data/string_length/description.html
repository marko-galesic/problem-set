<p>
  Given a string s, return its length.
</p>

<h3>Method Signature</h3>
<pre><code>public int stringLength(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
  <li>Preserve non-matching characters.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = ""
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
