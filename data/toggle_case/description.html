<p>
  Given a string s, swap the case of each letter.
</p>

<h3>Method Signature</h3>
<pre><code>public String toggleCase(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
  <li>Preserve non-matching characters.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "AbC"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"aBc"
</code></pre>
