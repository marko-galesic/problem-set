<p>
  Return the length of the longest consecutive run of 1 bits in n's binary representation.
</p>

<h3>Method Signature</h3>
<pre><code>public int longestRunOfOnes(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Count consecutive 1 bits in binary.</li>
  <li>Return 0 for n = 0.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
