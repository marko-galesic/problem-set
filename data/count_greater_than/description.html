<p>
  Given an array of integers nums and an integer threshold, return how many elements are greater than threshold.
</p>

<h3>Method Signature</h3>
<pre><code>public int countGreaterThan(int[] nums, int threshold)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 2, 3], threshold = 1
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2
</code></pre>
