<p>Return the number of bit positions where two integers differ.</p>

<h3>Method Signature</h3>
<pre><code>public int hammingDistance(int x, int y)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>x = 1
y = 4</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2</code></pre>
