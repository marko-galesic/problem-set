<p>
  Given a string s, return the words in reverse order separated by single spaces.
</p>

<h3>Method Signature</h3>
<pre><code>public String reverseWords(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Words are separated by whitespace.</li>
  <li>Use single spaces in the output.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "the sky is blue"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"blue is sky the"
</code></pre>
