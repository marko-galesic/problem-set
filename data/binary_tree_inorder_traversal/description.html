<p>Return the inorder traversal of a binary tree's node values.</p>

<h3>Method Signature</h3>
<pre><code>public int[] inorderTraversal(TreeNode root)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>root = [1, null, 2, 3]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>[1, 3, 2]</code></pre>
