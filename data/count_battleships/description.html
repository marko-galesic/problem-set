<h1>Count Battleships</h1>
<p>Given a board of 'X' and '.', return the number of battleships. Battleships are placed horizontally or vertically and separated by at least one cell.</p>
<h2>Example</h2>
<pre>
Input: board = [["X", ".", ".", "X"], [".", ".", ".", "X"], [".", ".", ".", "X"]]
Output: 2
</pre>
