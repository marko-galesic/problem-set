<p>Given a binary tree and two distinct values that exist in the tree, return the value of their lowest common ancestor.</p>

<h3>Method Signature</h3>
<pre><code>public int lowestCommonAncestor(TreeNode root, int p, int q)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>root = [3,5,1,6,2,0,8,null,null,7,4]
p = 5
q = 1</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3</code></pre>
