<p>
  Given a 2D integer matrix, return an array containing the sum of each column.
</p>

<h3>Method Signature</h3>
<pre><code>public int[] columnSums(int[][] matrix)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>matrix = [[1, 2, 3], [4, 5, 6]]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>[5, 7, 9]
</code></pre>
