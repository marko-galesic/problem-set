<p>
  Given a non-negative integer n, return the number of 1 bits in its binary representation.
</p>

<h3>Method Signature</h3>
<pre><code>public int countBits(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Assume n is non-negative.</li>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
