<p>Multiply two non-negative integers given as strings and return the product as a string.</p>

<h3>Method Signature</h3>
<pre><code>public String multiplyStrings(String num1, String num2)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>num1 = "123"
num2 = "456"</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"56088"</code></pre>
