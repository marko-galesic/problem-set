<p>
    Given strings <code>s</code> and <code>p</code>, return the start indices of <code>p</code>'s anagrams in <code>s</code>.
  </p>

  <h3>Method Signature</h3>
  <pre><code>public int[] findAnagrams(String s, String p)</code></pre>

  <h3>Requirements</h3>
  <ul>
    <li>Strings contain lowercase English letters</li>
<li>Return indices in ascending order</li>
  </ul>

  <h3>Example</h3>
  <p><strong>Input:</strong></p>
  <pre><code>s = "cbaebabacd", p = "abc"</code></pre>

  <p><strong>Output:</strong></p>
  <pre><code>[0, 6]</code></pre>
