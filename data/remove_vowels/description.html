<p>
  Given a string s, return s with all vowels removed. Vowels are a, e, i, o, u (case-insensitive).
</p>

<h3>Method Signature</h3>
<pre><code>public String removeVowels(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Vowels are a, e, i, o, u (case-insensitive).</li>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "hello"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"hll"
</code></pre>
