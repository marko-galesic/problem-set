<p>Return true if a binary tree is height-balanced (the heights of the two subtrees of any node never differ by more than one).</p>

<h3>Method Signature</h3>
<pre><code>public boolean isBalanced(TreeNode root)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>root = [3, 9, 20, null, null, 15, 7]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true</code></pre>
