<p>
  Given a string s, return the number of digit characters (0-9) in s.
</p>

<h3>Method Signature</h3>
<pre><code>public int countDigitsInString(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "a1b2"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2
</code></pre>
