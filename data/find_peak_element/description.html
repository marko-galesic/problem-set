<p>
  Return the index of a peak element.
</p>

<h3>Method Signature</h3>
<pre><code>public int findPeakElement(int[] nums)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>A peak is strictly greater than its neighbors.</li>
  <li>You may return any peak index.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1,2,3,1]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2
</code></pre>
