<p>
  Given two integers a and b, return their average as a floating point value.
</p>

<h3>Method Signature</h3>
<pre><code>public double averageOfTwoNumbers(int a, int b)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>a = 2, b = 3
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2.5
</code></pre>
