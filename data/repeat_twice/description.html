<p>
  Given a string s, return s repeated twice.
</p>

<h3>Method Signature</h3>
<pre><code>public String repeatTwice(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
  <li>Preserve non-matching characters.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "ab"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"abab"
</code></pre>
