<p>
    Given a mountain array, return the index of the peak element.
  </p>

  <h3>Method Signature</h3>
  <pre><code>public int peakIndexInMountainArray(int[] arr)</code></pre>

  <h3>Requirements</h3>
  <ul>
    <li>The peak is greater than its immediate neighbors.</li>
<li>The array length is at least 3.</li>
  </ul>

  <h3>Example</h3>
  <p><strong>Input:</strong></p>
  <pre><code>arr = [0, 1, 0]</code></pre>

  <p><strong>Output:</strong></p>
  <pre><code>1</code></pre>
