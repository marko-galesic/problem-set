<p>
  Given a string s, return true if its first character is a lowercase letter.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean startsWithLowercase(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "apple"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
