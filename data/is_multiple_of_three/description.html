<p>
  Given an integer n, return true if n is a multiple of 3.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean isMultipleOfThree(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
