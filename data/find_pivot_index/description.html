<p>Return the leftmost index where the sum of the numbers to the left equals the sum of the numbers to the right. Return -1 if no pivot exists.</p>

<h3>Method Signature</h3>
<pre><code>public int pivotIndex(int[] nums)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 7, 3, 6, 5, 6]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3</code></pre>
