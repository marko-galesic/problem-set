<p>
  Given a string s, return true if every character is a digit and s is not empty.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean isAllDigits(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "12345"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
