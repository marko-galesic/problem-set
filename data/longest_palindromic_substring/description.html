<p>Return the longest palindromic substring in the given string. If multiple answers exist, return the first one that appears in the string.</p>

<h3>Method Signature</h3>
<pre><code>public String longestPalindrome(String s)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "babad"</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"bab"</code></pre>
