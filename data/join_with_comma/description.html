<p>
  Given an array of strings words, join them with commas and return the result.
</p>

<h3>Method Signature</h3>
<pre><code>public String joinWithComma(String[] words)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>words = ["a", "b", "c"]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"a,b,c"
</code></pre>
