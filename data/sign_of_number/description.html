<p>
  Given an integer n, return 1 if n > 0, -1 if n < 0, and 0 otherwise.
</p>

<h3>Method Signature</h3>
<pre><code>public int signOfNumber(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
  <li>The input may be negative.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = -5
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>-1
</code></pre>
