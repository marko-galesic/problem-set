<p>
  Given an integer n, return the number of decimal digits using the absolute value.
</p>

<h3>Method Signature</h3>
<pre><code>public int numberOfDigits(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Use the absolute value of n when processing digits.</li>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>1
</code></pre>
