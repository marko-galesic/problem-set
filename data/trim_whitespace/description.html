<p>
  Given a string s, return s with leading and trailing whitespace removed.
</p>

<h3>Method Signature</h3>
<pre><code>public String trimWhitespace(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
  <li>Preserve non-matching characters.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "  hello  "
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"hello"
</code></pre>
