<p>Given a sorted array and a target value, return the index if the target is found. If not, return the index where it would be inserted in order.</p>

<h3>Method Signature</h3>
<pre><code>public int searchInsert(int[] nums, int target)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 3, 5, 6]
target = 5</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2</code></pre>
