<p>
  Given an adjacency matrix <code>isConnected</code> where <code>isConnected[i][j] = 1</code>
  indicates a direct connection between cities, return the number of provinces
  (connected components).
</p>

<h3>Method Signature</h3>
<pre><code>public int findCircleNum(int[][] isConnected)</code></pre>

<h3>Example</h3>
<pre><code>isConnected = [[1,1,0],[1,1,0],[0,0,1]]
Output: 2</code></pre>
