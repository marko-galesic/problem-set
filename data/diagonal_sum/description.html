<p>
  Given a square integer matrix, return the sum of the main diagonal.
</p>

<h3>Method Signature</h3>
<pre><code>public int diagonalSum(int[][] matrix)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>matrix = [[1, 2], [3, 4]]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>5
</code></pre>
