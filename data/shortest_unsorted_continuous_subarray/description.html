<p>
  Given an integer array, return the length of the shortest continuous subarray
  that, if sorted, would make the entire array sorted.
</p>

<h3>Method Signature</h3>
<pre><code>public int findUnsortedSubarray(int[] nums)</code></pre>

<h3>Example</h3>
<pre><code>nums = [2,6,4,8,10,9,15]
Output: 5</code></pre>
