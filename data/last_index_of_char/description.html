<p>
  Given a string s and a character c, return the index of the last occurrence of c, or -1 if not found.
</p>

<h3>Method Signature</h3>
<pre><code>public int lastIndexOfChar(String s, String c)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "hello", c = "l"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3
</code></pre>
