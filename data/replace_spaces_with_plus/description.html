<p>
  Given a string s, return s with each space replaced by "+".
</p>

<h3>Method Signature</h3>
<pre><code>public String replaceSpacesWithPlus(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "a b"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"a+b"
</code></pre>
