<p>Given an array of digits representing a non-negative integer, return the digits of the number plus one.</p>

<h3>Method Signature</h3>
<pre><code>public int[] plusOne(int[] digits)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>digits = [1, 2, 3]</code></pre>

<p><strong>Output:</strong></p>
<pre><code>[1, 2, 4]</code></pre>
