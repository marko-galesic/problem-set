<p>
  Given three integers a, b, and c, return the largest value.
</p>

<h3>Method Signature</h3>
<pre><code>public int maxOfThreeNumbers(int a, int b, int c)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>a = 1, b = 2, c = 3
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3
</code></pre>
