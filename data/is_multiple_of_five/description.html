<p>
  Given an integer n, return true if it is a multiple of 5.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean isMultipleOfFive(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
  <li>0 is a multiple of any integer.</li>
  <li>The input may be negative.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
