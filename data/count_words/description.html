<p>
  Given a string s, return the number of words separated by whitespace.
</p>

<h3>Method Signature</h3>
<pre><code>public int countWords(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "hello world"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2
</code></pre>
