<p>
  Given a string s, return the index of its first non-repeating character.
</p>

<h3>Method Signature</h3>
<pre><code>public int firstNonRepeatingChar(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the index of the first non-repeating character.</li>
  <li>Return -1 if no such character exists.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "leetcode"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
