<p>
  Given integers n, low, and high, clamp n into the inclusive range [low, high].
</p>

<h3>Method Signature</h3>
<pre><code>public int clampToRange(int n, int low, int high)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 5, low = 0, high = 10
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>5
</code></pre>
