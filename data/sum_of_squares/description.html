<p>
  Given two integers a and b, return a^2 + b^2.
</p>

<h3>Method Signature</h3>
<pre><code>public int sumOfSquares(int a, int b)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>a = 2, b = 3
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>13
</code></pre>
