<p>
  Given a string s, return true if s contains at least one vowel.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean containsVowel(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Vowels are a, e, i, o, u (case-insensitive).</li>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "rhythm"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>false
</code></pre>
