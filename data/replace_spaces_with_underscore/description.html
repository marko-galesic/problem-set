<p>
  Given a string s, replace each space with an underscore and return the result.
</p>

<h3>Method Signature</h3>
<pre><code>public String replaceSpacesWithUnderscore(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "hello world"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"hello_world"
</code></pre>
