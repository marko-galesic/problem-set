<p>
  Given stones on a 2D grid, you can remove a stone if another stone shares its
  row or column. Return the maximum number of stones that can be removed.
</p>

<h3>Method Signature</h3>
<pre><code>public int removeStones(int[][] stones)</code></pre>

<h3>Example</h3>
<pre><code>stones = [[0,0],[0,1],[1,0],[1,2],[2,1],[2,2]]
Output: 5</code></pre>
