<p>
    Return the number of distinct bitwise OR values across all subarrays of arr.
  </p>

  <h3>Method Signature</h3>
  <pre><code>public int subarrayBitwiseORs(int[] arr)</code></pre>

  <h3>Requirements</h3>
  <ul>
    <li>Consider all contiguous subarrays.</li>
<li>Return the count of distinct OR results.</li>
  </ul>

  <h3>Example</h3>
  <p><strong>Input:</strong></p>
  <pre><code>arr = [0]</code></pre>

  <p><strong>Output:</strong></p>
  <pre><code>1</code></pre>
