<p>
  Return the level order traversal of a binary tree.
</p>

<h3>Method Signature</h3>
<pre><code>public int[][] levelOrderTraversal(TreeNode root)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return values level by level.</li>
  <li>Return an empty list for a null tree.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>root = [3,9,20,null,null,15,7]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>[[3], [9, 20], [15, 7]]
</code></pre>
