<p>
  Given an integer n, repeatedly sum its digits until a single digit remains. Use the absolute value.
</p>

<h3>Method Signature</h3>
<pre><code>public int digitalRoot(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Use the absolute value of n when processing digits.</li>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
