<p>
  Given a string s, return a new string with the first and last characters swapped.
</p>

<h3>Method Signature</h3>
<pre><code>public String swapFirstLastChar(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "ab"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"ba"
</code></pre>
