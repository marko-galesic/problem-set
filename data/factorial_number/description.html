<p>
  Given an integer n, return n factorial. If n < 0, return 0.
</p>

<h3>Method Signature</h3>
<pre><code>public int factorialNumber(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Follow the rule for negative values described above.</li>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = -1
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
