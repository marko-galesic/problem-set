<p>
  Given a string s and an integer n, return s repeated n times.
</p>

<h3>Method Signature</h3>
<pre><code>public String repeatNTimes(String s, int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "ab", n = 3
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"ababab"
</code></pre>
