<p>Reverse the bits of a 32-bit unsigned integer and return the resulting integer.</p>

<h3>Method Signature</h3>
<pre><code>public int reverseBits(int n)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 43261596</code></pre>

<p><strong>Output:</strong></p>
<pre><code>964176192</code></pre>
