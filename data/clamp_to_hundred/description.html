<p>
  Given an integer n, clamp it to the range [-100, 100].
</p>

<h3>Method Signature</h3>
<pre><code>public int clampToHundred(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
  <li>The input may be negative.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = -150
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>-100
</code></pre>
