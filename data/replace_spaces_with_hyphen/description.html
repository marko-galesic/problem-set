<p>
  Given a string s, replace every space character with a hyphen.
</p>

<h3>Method Signature</h3>
<pre><code>public String replaceSpacesWithHyphen(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
  <li>Preserve non-matching characters.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "a b c"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"a-b-c"
</code></pre>
