<p>Given an array and two indices left and right, return the sum of elements between them (inclusive).</p>

<h3>Method Signature</h3>
<pre><code>public int rangeSum(int[] nums, int left, int right)</code></pre>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 2, 3, 4, 5]
left = 1
right = 3</code></pre>

<p><strong>Output:</strong></p>
<pre><code>9</code></pre>
