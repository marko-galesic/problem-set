<p>
  Given an integer n, return true if n is positive.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean isPositive(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
  <li>The input may be negative.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = -1
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>false
</code></pre>
