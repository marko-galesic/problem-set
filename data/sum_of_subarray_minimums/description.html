<p>
  Given an array of integers, return the sum of the minimum value of every
  subarray. Since the result can be large, return it modulo <code>1,000,000,007</code>.
</p>

<h3>Method Signature</h3>
<pre><code>public int sumSubarrayMins(int[] arr)</code></pre>

<h3>Example</h3>
<pre><code>arr = [3,1,2,4]
Output: 17</code></pre>
