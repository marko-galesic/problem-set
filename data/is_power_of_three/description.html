<p>
  Return true if n is a power of three.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean isPowerOfThree(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return true only for powers of three.</li>
  <li>n must be positive to return true.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 27
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
