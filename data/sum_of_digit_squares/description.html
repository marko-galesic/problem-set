<p>
  Given an integer n, return the sum of the squares of its digits.
</p>

<h3>Method Signature</h3>
<pre><code>public int sumOfDigitSquares(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Use the absolute value of n.</li>
  <li>Return 0 for n = 0.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
