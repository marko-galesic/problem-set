<p>
  Return the number of set bits (1s) in the binary representation of n.
</p>

<h3>Method Signature</h3>
<pre><code>public int countSetBits(int n)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Count the number of 1 bits in the binary representation.</li>
  <li>Treat n as a non-negative integer.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>n = 0
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
