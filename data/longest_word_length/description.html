<p>
  Given an array of strings words, return the length of the longest word.
</p>

<h3>Method Signature</h3>
<pre><code>public int longestWordLength(String[] words)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>words = ["a", "bb", "ccc"]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3
</code></pre>
