<p>
  Given an array of integers nums, return a new array with elements in reverse order.
</p>

<h3>Method Signature</h3>
<pre><code>public int[] reverseArray(int[] nums)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 2, 3]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>[3, 2, 1]
</code></pre>
