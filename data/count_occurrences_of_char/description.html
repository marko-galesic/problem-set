<p>
  Given a string s and a character c, return how many times c appears in s.
</p>

<h3>Method Signature</h3>
<pre><code>public int countOccurrencesOfChar(String s, String c)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "hello", c = "l"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>2
</code></pre>
