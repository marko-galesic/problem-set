<p>
  Given an array of integers nums and an integer target, return true if target appears in nums.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean containsTarget(int[] nums, int target)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 2, 3], target = 2
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
