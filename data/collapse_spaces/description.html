<p>
  Given a string s, trim it and collapse consecutive whitespace into a single space.
</p>

<h3>Method Signature</h3>
<pre><code>public String collapseSpaces(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Collapse consecutive whitespace to single spaces.</li>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "  a   b  c "
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>"a b c"
</code></pre>
