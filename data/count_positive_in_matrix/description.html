<p>
  Given a 2D integer matrix, return the count of positive values.
</p>

<h3>Method Signature</h3>
<pre><code>public int countPositiveInMatrix(int[][] matrix)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>matrix = [[1, -2, 3], [0, 4, -5]]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3
</code></pre>
