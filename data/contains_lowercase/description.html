<p>
  Given a string s, return true if it contains any lowercase letter (a-z).
</p>

<h3>Method Signature</h3>
<pre><code>public boolean containsLowercase(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "HELLO"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>false
</code></pre>
