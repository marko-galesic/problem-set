<p>
  Return true if the array can be partitioned into two subsets with equal sum.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean canPartition(int[] nums)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Each element can be used at most once.</li>
  <li>Return true if an equal-sum partition exists.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1,5,11,5]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
