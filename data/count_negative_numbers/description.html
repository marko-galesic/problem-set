<p>
  Given an array of integers nums, return the count of negative numbers.
</p>

<h3>Method Signature</h3>
<pre><code>public int countNegativeNumbers(int[] nums)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>nums = [1, 2, 3]
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>0
</code></pre>
