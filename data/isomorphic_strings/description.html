<p>
  Return true if strings s and t are isomorphic.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean isIsomorphic(String s, String t)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Characters must map one-to-one between strings.</li>
  <li>Order must be preserved.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "egg", t = "add"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
