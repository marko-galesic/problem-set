<p>
  Given a string s, return the number of consonant letters (a-z) excluding vowels.
</p>

<h3>Method Signature</h3>
<pre><code>public int countConsonants(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>The input may be empty.</li>
  <li>Preserve non-matching characters.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "hello"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>3
</code></pre>
