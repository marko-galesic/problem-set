<p>
  Given a string s, return true if s starts with an uppercase English letter.
</p>

<h3>Method Signature</h3>
<pre><code>public boolean startsWithCapital(String s)</code></pre>

<h3>Requirements</h3>
<ul>
  <li>Return the computed value.</li>
</ul>

<h3>Example</h3>
<p><strong>Input:</strong></p>
<pre><code>s = "Hello"
</code></pre>

<p><strong>Output:</strong></p>
<pre><code>true
</code></pre>
